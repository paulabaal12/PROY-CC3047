<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Service Desk del Catálogo Centroamericano de Videojuegos (centralamerica.games)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('cag-sd:settings:v1') || '{}');
        if (s.themeMode === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <title>Service Desk · centralamerica.games</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
